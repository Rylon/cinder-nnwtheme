# git-cliff configuration — generates release notes from Conventional Commits.
# The Publish workflow (.github/workflows/release.yml, from the theme template)
# generates each release's notes with this file when its notes are left empty; the
# changelog is not committed back to the repo.

[changelog]
# Rendered per release. `header` is stripped in CI (--strip header) so only the
# body lands in the GitHub Release.
header = "# Changelog\n\n"
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }}{% if timestamp %} — {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Group by commit type; drop noise. Unmatched conventional types fall through.
# group_by sorts sections by name, so each group starts with a hidden
# "<!-- NN -->" that sets the order (Features first); the body strips it.
commit_parsers = [
  { message = "^feat", group = "<!-- 00 -->Features" },
  { message = "^fix", group = "<!-- 01 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 02 -->Performance" },
  { message = "^refactor", group = "<!-- 04 -->Refactor" },
  { message = "^style", group = "<!-- 05 -->Styling" },
  { message = "^test", group = "<!-- 07 -->Testing" },
  { message = "^docs", group = "<!-- 06 -->Documentation" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^chore", group = "<!-- 09 -->Miscellaneous" },
  { message = "^ci", skip = true },
  { message = "^build", group = "<!-- 08 -->Build" },
  { body = ".*security", group = "<!-- 03 -->Security" },
]
# Keep releases focused: skip anything tagged as a release-candidate/beta.
skip_tags = "v.*-(alpha|beta|rc).*"
tag_pattern = "v[0-9].*"
filter_commits = false
sort_commits = "oldest"
