title = 'Anatomy of a kvetch'
body = '''
<p>It appears to be an unspoken conviction, among academics, that there is no field of study so uncool that it cannot be made at least somewhat cooler by appending the word &#8220;critical&#8221; to its title. This is what has led to the emergence, over the years, not just of &#8220;critical legal studies&#8221; and &#8220;critical race theory,&#8221; but also &#8220;<a href="https://en.wikipedia.org/wiki/Critical_code_studies">critical coding studies</a>&#8221; and &#8220;<a href="https://en.wikipedia.org/wiki/Critical_university_studies">critical university studies</a>.&#8221; My personal favorite is &#8220;<a href="https://www.sciencespo.fr/mass-violence-war-massacre-resistance/en/document/toward-theory-critical-genocide-studies.html">critical genocide studies</a>&#8221; &#8211; with its apparent implication that practitioners of the traditional variant had been overly complacent about the phenomenon.</p><p>Indeed, we now live in an age of <a href="https://quod.lib.umich.edu/h/humfig/11217607.0002.205/--critique-and-overcritique-in-sociology?rgn=main;view=fulltext">overcritique</a>. A major consequence has been the growing movement, within the academy, for a critique of critique. To get the flavour of this, consider Tom Boland&#8217;s book, <em><a href="https://www.routledge.com/The-Spectacle-of-Critique-From-Philosophy-to-Cacophony/Boland/p/book/9780367479046">The Spectacle of Critique</a></em>, which opens with this banger:</p><blockquote><p>Today there is no dearth of critique, but abundance, proliferation or even superfluity. Any account of &#8216;Critique&#8217; can be critiqued, therefore this book concerns critiques in the plural. Critique abounds in contemporary society and constitutes a major dimension of modern thought. Thus, this book is inevitably also partially a critique, partially a &#8216;post-critical&#8217; account, in that it refuses to be critical in a certain way, but nonetheless the book is partially an &#8216;acritical&#8217; or &#8216;non-critical&#8217; account of critique, which attempts to recognize critiques as complex cultural forms which should be better understood.</p></blockquote><p>Despite the writing style, I loved this book, because it addresses such an obvious and yet neglected question. Critical theorists have always prided themselves on their commitment to reflexivity. Boland basically stands up and says &#8220;okay then, WTF are we doing?&#8221; He demands that we subject critique &#8211; as an academic practice &#8211; to the same forms of critical sociological investigation that we apply to all other ideological configurations. After all, it does look like a power/knowledge complex...</p><p>The source of this reflexive turn &#8211; the point at which the serpent of critique began to nibble its own tail &#8211; was undoubtedly Bruno Latour&#8217;s <em>mea culpa</em> &#8220;<a href="https://www.journals.uchicago.edu/doi/abs/10.1086/421123">Why has Critique Run out of Steam?</a>&#8221; The important thing to observe about these reflections is that they are not being made polemically, by people on the outside, repeating the usual complaints about postmodernism. They are coming from within the church. Furthermore, the critics of critique are using what everyone can easily recognize as the conceptual arsenal of critique to carry out their investigations.</p><p>I myself have been something of a bystander &#8211; or perhaps an amused onlooker &#8211; in these developments. Since I was never tempted by the more totalizing forms of critique that are now self-imploding, I don&#8217;t have much at stake. My own work fits squarely within the tradition of Frankfurt School critical theory that basically evolved into <a href="https://global.oup.com/academic/product/normativity-and-power-9780198798873?cc=ca&amp;lang=en&amp;">liberal Kantianism</a> sometime in the late 20<sup>th</sup> century. This particular variant was always concerned, sometimes to a fault, with making explicit the normative foundations of its own enterprise, and so these sorts of &#8220;what are we doing?&#8221; questions are less difficult to answer.</p><p>Nevertheless, I do share the general sense that use of the term &#8220;critique&#8221; and &#8220;critical&#8221; has gotten out of hand. My own understanding of critical theory is just the old-school position, that critical theory, or critical social science, is a form of social-scientific inquiry that combines in an explicit manner normative, empirical, and pragmatic concerns. As James Bohman <a href="https://plato.stanford.edu/archives/sum2015/entries/critical-theory/">once wrote</a> (with respect to Max Horkheimer&#8217;s article &#8220;Critical and Traditional Theory&#8221;):</p><blockquote><p>It follows from Horkheimer&#8217;s definition that a critical theory is adequate only if it meets three criteria: it must be explanatory, practical, and normative, all at the same time. That is, it must explain what is wrong with current social reality, identify the actors to change it, and provide both clear norms for criticism and achievable practical goals for social transformation.</p></blockquote><p>According to this standard, most of what gets passed off as &#8220;critical&#8221; scholarship these days does not actually qualify as critical theory, at least not in this traditional sense. Most obviously, it makes no effort to state explicitly the normative grounds of its inquiry. Much of this work employs an analytical framework derived from Michel Foucault or Pierre Bourdieu, both theorists who explicitly denied the possibility of a normatively grounded critique of society. This explains why theorists working in this vein, despite being clearly motivated by a commitment to social justice, are so evasive when it comes to actually stating what they think justice requires of us.</p><p>A lot has been written on this subject, to the point where people are pretty much sick of the whole &#8220;normative grounds&#8221; debate. Lately I&#8217;ve become more interested in the pragmatic dimension of critical theory, or the idea that critical theory is not supposed to be engaged in just abstract moral condemnation of social reality, but rather action-guiding identification of problems that can be alleviated. All of this is downstream, in a sense, from the distinction that Herbert Marcuse drew, back in the 1950s, <a href="https://www.routledge.com/Eros-and-Civilization-A-Philosophical-Inquiry-Into-Freud/Marcuse/p/book/9781032533728">between &#8220;necessary&#8221; and &#8220;surplus&#8221; repression</a>. He was granting Freud&#8217;s point that all of society is based on repression of our instinctual nature. Simply pointing this out does not amount to a critique though, because there are good reasons to maintain a lot of this repression. Our problem, Marcuse observed, is that a great deal of the repression is <em>unnecessary</em>, in the sense that it is not actually needed to maintain the desirable features of the social order. The task of critique is therefore to identify this &#8220;surplus&#8221; repression, precisely because it can be abolished without ill consequence.</p><p>These reflections have led me to want to gatekeep the word &#8220;critique,&#8221; at least a little bit, based on the thought that you&#8217;re not really doing critique if you&#8217;re not at least making an effort to show that the problems you&#8217;ve identified are remediable. (Consider again Bohman&#8217;s insistence that critique must present &#8220;achievable practical goals for social transformation.&#8221;) Nowhere is this gatekeeping more needed than in the rhetoric surrounding &#8220;capitalism,&#8221; along with the recent trend in political philosophy toward highly moralized complaints about the imperfections of that system. This discussion is positively suffused with bad faith, because despite all of the semi-Marxist posturing and rhetorical condemnation, no one has the faintest idea how to design a socialist system that would represent any sort of an improvement.</p><p>Probably the most comical example of this can be found in Mark Fisher&#8217;s book, <a href="https://dn790002.ca.archive.org/0/items/capitalist-realism-is-there-no-alternative/Capitalist%20Realism_%20Is%20there%20no%20alternativ%20-%20Mark%20Fisher.pdf">Capitalist Realism: Is There No Alternative?</a>, in which he condemns as ideological the view that there is no alternative to capitalism, spends a hundred or so pages complaining about the cognitive capture of the left (&#8220;the &#8216;realism&#8217; here is analogous to the deflationary perspective of a depressive who believes that any positive state, any hope, is a dangerous illusion&#8221;), and then wraps up the book <em>without presenting any alternative to capitalism</em>.</p><p>Unfortunately, these debates about capitalism have a tendency to become polarized, because it&#8217;s always possible to find someone willing to deny that the obvious flaws and injustices of the capitalist system are actually flaws or injustices. This puts me in a somewhat awkward position, because I think that the usual complaints are for the most part justified <em><a href="https://www.studocu.com/en-gb/messages/question/6644626/what-is-a-pro-tanto-reason">pro tanto</a></em> (as we philosophers like to say), but that given the absence of feasible alternatives, they do not add up to an all-things-considered indictment of the capitalist system. Because of this, I want to signal my agreement with the critics of capitalism, and yet deny that their criticisms have any practical import.</p><p>The frustration that I have, with most of these critics, is that if you gave them a menu of <em>feasible</em> options for organizing a complex economy and asked them to pick one, the vast majority, after a bit of foot-dragging, would choose some form of suitably regulated market economy with a generous welfare state. So then what is the point of all the bluster about capitalism, if you don&#8217;t intend to do anything about it? It just seems like an idle complaint. More specifically, it seems like <em>kvetching</em> (definition: kvetch, an <a href="https://en.wikipedia.org/wiki/List_of_English_words_of_Yiddish_origin#Kvetch">English word of Yiddish origin</a> meaning &#8220;to gripe,&#8221; &#8220;someone who complains habitually&#8221;).</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" target="_blank" href="https://substackcdn.com/image/fetch/$s_!w8hR!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb3857f5d-ae43-40ed-aa0f-99ff4b81f235_616x452.jpeg" data-component-name="Image2ToDOM"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!w8hR!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb3857f5d-ae43-40ed-aa0f-99ff4b81f235_616x452.jpeg 424w, https://substackcdn.com/image/fetch/$s_!w8hR!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb3857f5d-ae43-40ed-aa0f-99ff4b81f235_616x452.jpeg 848w, https://substackcdn.com/image/fetch/$s_!w8hR!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb3857f5d-ae43-40ed-aa0f-99ff4b81f235_616x452.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!w8hR!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb3857f5d-ae43-40ed-aa0f-99ff4b81f235_616x452.jpeg 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!w8hR!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb3857f5d-ae43-40ed-aa0f-99ff4b81f235_616x452.jpeg" width="616" height="452" data-attrs="{&quot;src&quot;:&quot;https://substack-post-media.s3.amazonaws.com/public/images/b3857f5d-ae43-40ed-aa0f-99ff4b81f235_616x452.jpeg&quot;,&quot;srcNoWatermark&quot;:null,&quot;fullscreen&quot;:null,&quot;imageSize&quot;:null,&quot;height&quot;:452,&quot;width&quot;:616,&quot;resizeWidth&quot;:null,&quot;bytes&quot;:50992,&quot;alt&quot;:null,&quot;title&quot;:null,&quot;type&quot;:&quot;image/jpeg&quot;,&quot;href&quot;:null,&quot;belowTheFold&quot;:true,&quot;topImage&quot;:false,&quot;internalRedirect&quot;:&quot;https://josephheath.substack.com/i/180566127?img=https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb3857f5d-ae43-40ed-aa0f-99ff4b81f235_616x452.jpeg&quot;,&quot;isProcessing&quot;:false,&quot;align&quot;:null,&quot;offset&quot;:false}" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!w8hR!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb3857f5d-ae43-40ed-aa0f-99ff4b81f235_616x452.jpeg 424w, https://substackcdn.com/image/fetch/$s_!w8hR!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb3857f5d-ae43-40ed-aa0f-99ff4b81f235_616x452.jpeg 848w, https://substackcdn.com/image/fetch/$s_!w8hR!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb3857f5d-ae43-40ed-aa0f-99ff4b81f235_616x452.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!w8hR!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb3857f5d-ae43-40ed-aa0f-99ff4b81f235_616x452.jpeg 1456w" sizes="100vw" loading="lazy"></picture><div class="image-link-expand"><div class="pencraft pc-display-flex pc-gap-8 pc-reset"><button tabindex="0" type="button" class="pencraft pc-reset pencraft icon-container restack-image buttonBase-GK1x3M"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.5" stroke="var(--color-fg-primary)" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" class="icon-noB79L"><g><path d="M2.53001 7.81595C3.49179 4.73911 6.43281 2.5 9.91173 2.5C13.1684 2.5 15.9537 4.46214 17.0852 7.23684L17.6179 8.67647M17.6179 8.67647L18.5002 4.26471M17.6179 8.67647L13.6473 6.91176M17.4995 12.1841C16.5378 15.2609 13.5967 17.5 10.1178 17.5C6.86118 17.5 4.07589 15.5379 2.94432 12.7632L2.41165 11.3235M2.41165 11.3235L1.5293 15.7353M2.41165 11.3235L6.38224 13.0882"></path></g></svg></button><button tabindex="0" type="button" class="pencraft pc-reset pencraft icon-container view-image buttonBase-GK1x3M"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-maximize2 lucide-maximize-2 icon-noB79L"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" x2="14" y1="3" y2="10"></line><line x1="3" x2="10" y1="21" y2="14"></line></svg></button></div></div></div></a></figure></div><p>This little terminological innovation, I realized, was the solution to my problem. By introducing a distinction between critique and kvetch, I was able to state, in an economical fashion, my frustration with a great deal of the current literature in political economy (and &#8220;critical studies&#8221; more generally). Most of it is just a list of complaints. The problem is not that these complaints are wrong, but that they don&#8217;t add up to anything, because no effort is made to show that they are remediable. As a result, the entire exercise amounts to just kvetching. Critique, in my view, is not a label that one can stick on anything, it is a status that one must <em>aspire</em> to.</p><p>I started using this terminology mainly to pressure some graduate students into upping their game, but I had an opportunity to employ it more seriously when I was asked to contribute to a symposium on Waheed Hussain&#8217;s book, <em>Living with the Invisible Hand</em>. Waheed, as many of you will know, was a colleague of mine at the University of Toronto who died of cancer at a tragically young age. His book, which I had read several times in draft, was published posthumously in 2023. My central disagreements with Waheed, over the years, had been on precisely this point. His criticisms of the market, I felt, were based on incredibly strict moral principles, which not only ruled out the market, but basically ruled out any institutional system that realistically might be used to organize a complex division of labour.</p><p>The resulting paper, &#8220;<a href="https://www.cambridge.org/core/journals/canadian-journal-of-philosophy/article/hussain-on-the-market-critique-or-kvetch/4C2164280E90358C752098C129150F6C">Hussain on the Market: Critique or Kvetch</a>?&#8221; has recently been published by the <em>Canadian Journal of Philosophy</em>. There are also nice pieces from the symposium by <a href="https://www.cambridge.org/core/journals/canadian-journal-of-philosophy/article/freedom-and-the-invisible-hand-hussain-on-the-judgmentbypassing-character-of-the-market/679466C8A436B745FEC5494138C0D25B">Andrew Franklin-Hall</a> and <a href="https://www.cambridge.org/core/journals/canadian-journal-of-philosophy/article/patterns-prices-and-powers-hussain-on-market-governance/5C1891D5DA32D1566A53C96E24E7227D">Louis-Philippe Hodgson</a>. So for those who find my remarks above provocative, but insufficiently developed, I would heartily recommend the full paper. I should mention, by the way, that when I gave this paper outside Toronto some people thought I was being mean with the title. The reality is quite the opposite &#8211; it is both an expression of affection and a bit of an inside joke. Because anyone who knew Waheed knew that he was an epic and unrepentant <em>kvetcher</em>.</p>
'''
