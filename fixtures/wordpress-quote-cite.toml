<p class="wp-block-paragraph">Last year I wrote how I&#8217;d switched from Docker Desktop to <a href="https://rylon.dev/2023/02/02/switching-from-docker-desktop-to-colima/">Colima</a>, but later that same year I stumbled across a brand new solution that was in development, called <a href="https://orbstack.dev">OrbStack</a>. The author was pretty communicative on Mastodon and so I downloaded it during the beta to take it for a spin, and was immediately blown away.</p>



