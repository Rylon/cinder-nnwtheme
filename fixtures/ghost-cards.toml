                    </div>
                
                
                    <div class="kg-cta-content-inner">
                    
                        <div class="kg-cta-text">
                            <p><span style="white-space: pre-wrap;">Always wanted a search engine with no ads, surveillance, or junk? </span><a href="https://kagi.com/?ref=ghost.org" class="cta-link-color"><b><strong style="white-space: pre-wrap;">Kagi</strong></b></a><span style="white-space: pre-wrap;">, the world&apos;s best search engine, is giving Ghost users </span><b><strong style="white-space: pre-wrap;">90 days</strong></b><span style="white-space: pre-wrap;"> of free access to their Professional plan for new accounts. Happy searching! </span></p>
                        </div>
                    
                    
                        <a href="https://kagi.com/p/GHOST2768135B82?ref=ghost.org" class="kg-cta-button " style="background-color: #000000; color: #FFFFFF;">
                            UPGRADE YOUR SEARCH NOW
                        </a>
                        
                    </div>
                
            </div>
        </div>
<p>A button card:</p>
<div class="kg-card kg-button-card kg-align-left"><a href="https://youtu.be/jveUllo7Mjs?si=-zx-IWmxldVCPf4w&amp;t=2748" class="kg-btn kg-btn-accent">Off By One, Episode #2, 45:47</a></div>
<p>A gallery card:</p>
<figure class="kg-card kg-gallery-card kg-width-wide"><div class="kg-gallery-container"><div class="kg-gallery-row"><div class="kg-gallery-image"><img src="https://storage.ghost.io/c/0f/76/0f76b548-bc58-4f25-abc3-3f5ebca07da4/content/images/2026/09/CleanShot-2026-09-25-at-1.55.02-PM@2x.png" width="934" height="1098" loading="lazy" alt="AI Love Song for Mistress Played at Murder Trial Is Most Excruciating Watch in Recent Memory" srcset="https://storage.ghost.io/c/0f/76/0f76b548-bc58-4f25-abc3-3f5ebca07da4/content/images/size/w600/2026/09/CleanShot-2026-09-25-at-1.55.02-PM@2x.png 600w, https://storage.ghost.io/c/0f/76/0f76b548-bc58-4f25-abc3-3f5ebca07da4/content/images/2026/09/CleanShot-2026-09-25-at-1.55.02-PM@2x.png 934w" sizes="(min-width: 720px) 720px"></div><div class="kg-gallery-image"><img src="https://storage.ghost.io/c/0f/76/0f76b548-bc58-4f25-abc3-3f5ebca07da4/content/images/2026/09/CleanShot-2026-09-25-at-1.54.59-PM@2x.png" width="1212" height="1050" loading="lazy" alt="AI Love Song for Mistress Played at Murder Trial Is Most Excruciating Watch in Recent Memory" srcset="https://storage.ghost.io/c/0f/76/0f76b548-bc58-4f25-abc3-3f5ebca07da4/content/images/size/w600/2026/09/CleanShot-2026-09-25-at-1.54.59-PM@2x.png 600w, https://storage.ghost.io/c/0f/76/0f76b548-bc58-4f25-abc3-3f5ebca07da4/content/images/size/w1000/2026/09/CleanShot-2026-09-25-at-1.54.59-PM@2x.png 1000w, https://storage.ghost.io/c/0f/76/0f76b548-bc58-4f25-abc3-3f5ebca07da4/content/images/2026/09/CleanShot-2026-09-25-at-1.54.59-PM@2x.png 1212w" sizes="(min-width: 720px) 720px"></div></div><div class="kg-gallery-row"><div class="kg-gallery-image"><img src="https://storage.ghost.io/c/0f/76/0f76b548-bc58-4f25-abc3-3f5ebca07da4/content/images/2026/09/CleanShot-2026-09-25-at-1.54.55-PM@2x.png" width="1310" height="1208" loading="lazy" alt="AI Love Song for Mistress Played at Murder Trial Is Most Excruciating Watch in Recent Memory" srcset="https://storage.ghost.io/c/0f/76/0f76b548-bc58-4f25-abc3-3f5